<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Region picker</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  ::selection { background: transparent; color: inherit; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; color: #fff; }
  body { background-size: 100% 100%; background-repeat: no-repeat; }
  #surface { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,.38); pointer-events: none; }
  #rect { position: absolute; display: none; border: 2px solid #D85631; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
  #size { position: absolute; display: none; padding: 3px 8px; border-radius: 6px; background: #D85631; pointer-events: none;
    font: 700 12px Consolas, monospace; white-space: nowrap; }
  #tip { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
    padding: 9px 10px 9px 18px; background: rgba(24,24,24,.94); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  #cancel { cursor: pointer; border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3a3a; color: #fff;
    font: 600 12px "Segoe UI", Arial, sans-serif; }
  #cancel:hover { background: #D85631; }
</style>
</head>
<body>
  <div id="surface"></div>
  <div id="dim"></div>
  <div id="rect"></div>
  <div id="size"></div>
  <div id="tip"><span>Drag to select the recording region · Esc to cancel</span><button id="cancel" type="button">Cancel</button></div>
<script>
const { ipcRenderer } = require('electron');
const surface = document.getElementById('surface');
const dim = document.getElementById('dim');
const rect = document.getElementById('rect');
const sizeLabel = document.getElementById('size');
let origin = { x: 0, y: 0 };
let start = null;

function cancel() { ipcRenderer.send('region-selected', { cancelled: true }); }
function reset() {
  start = null;
  rect.style.display = 'none';
  sizeLabel.style.display = 'none';
  dim.style.display = 'block';
}
function box(x, y) {
  const left = Math.min(start.x, x), top = Math.min(start.y, y);
  return { left, top, width: Math.abs(x - start.x), height: Math.abs(y - start.y) };
}
function draw(x, y) {
  const b = box(x, y);
  dim.style.display = 'none';
  rect.style.display = 'block';
  rect.style.left = b.left + 'px'; rect.style.top = b.top + 'px';
  rect.style.width = b.width + 'px'; rect.style.height = b.height + 'px';
  sizeLabel.style.display = 'block';
  sizeLabel.textContent = Math.round(b.width) + ' × ' + Math.round(b.height);
  sizeLabel.style.left = b.left + 'px';
  sizeLabel.style.top = Math.max(4, b.top - 28) + 'px';
}

ipcRenderer.on('start-region-select', (_e, data) => {
  origin = (data && data.origin) || { x: 0, y: 0 };
  reset();
  if (data && data.image) {
    document.body.style.backgroundImage = 'url("' + data.image + '")';
    const img = new Image();
    img.onload = img.onerror = () => ipcRenderer.send('overlay-ready');
    img.src = data.image;
  } else {
    // Fallback (screen capture unavailable): transparent picker over the live desktop.
    document.body.style.backgroundImage = 'none';
    dim.style.background = 'rgba(0,0,0,.2)';
    ipcRenderer.send('overlay-ready');
  }
});
ipcRenderer.on('cancel-region-select', reset);

// Both mouse buttons can start a selection (left-handed / swapped buttons), no context menu, no text selection.
surface.addEventListener('contextmenu', e => e.preventDefault());
surface.addEventListener('dragstart', e => e.preventDefault());
surface.addEventListener('selectstart', e => e.preventDefault());
surface.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.button !== 2) return;
  e.preventDefault();
  const sel = window.getSelection(); if (sel) sel.removeAllRanges();
  surface.setPointerCapture(e.pointerId);
  start = { x: e.clientX, y: e.clientY };
  draw(e.clientX, e.clientY);
});
surface.addEventListener('pointermove', e => { if (start) draw(e.clientX, e.clientY); });
surface.addEventListener('pointerup', e => {
  if (!start) return;
  const b = box(e.clientX, e.clientY);
  start = null;
  if (b.width < 8 || b.height < 8) { reset(); return; }
  ipcRenderer.send('region-selected', {
    x: Math.round(origin.x + b.left), y: Math.round(origin.y + b.top),
    width: Math.max(2, Math.floor(b.width / 2) * 2), height: Math.max(2, Math.floor(b.height / 2) * 2)
  });
});
surface.addEventListener('pointercancel', reset);
document.getElementById('cancel').addEventListener('click', cancel);
window.addEventListener('keydown', e => { if (e.key === 'Escape') cancel(); });
</script>
</body>
</html>
